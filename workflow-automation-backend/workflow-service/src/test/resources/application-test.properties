# Test Configuration - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# RabbitMQ test config
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.queue=workflow.execution.queue.test
app.rabbitmq.exchange=workflow.execution.exchange.test
app.rabbitmq.routingkey=workflow.execution.routingkey.test

# Google OAuth test config
google.oauth.client-id=test-client-id
google.oauth.client-secret=test-client-secret
google.oauth.redirect-uri=http://localhost:8082/api/integrations/google/callback
google.oauth.scopes=https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.readonly