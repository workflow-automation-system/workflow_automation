# Test Configuration - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable mail configuration for tests
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT test secret
jwt.secret=test-secret-key-for-testing-only-not-real
jwt.secret=test-secret-key-with-minimum-32-characters
organization.service.url=http://localhost:8083/api/organizations

# URLs for testing
app.frontend-url=http://localhost:3000
app.backend-url=http://localhost:8085
