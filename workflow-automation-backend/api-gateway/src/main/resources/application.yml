server:
  port: 8085

jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}

spring:
  application:
    name: api_gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: workflow-service
          uri: ${WORKFLOW_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/workflows/**, /api/executions/**, /api/integrations/**, /api/templates/**
        - id: organization-service
          uri: ${ORGANIZATION_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/organizations/**
        - id: audit-service
          uri: ${AUDIT_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/audit/**