server:
  port: 8085

spring:
  application:
    name: api_gateway
  cloud:
    gateway:
      # This cleans up any duplicate headers if they occur
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
              - "https://*.vercel.app"
              - "https://workflow-automation-navy-xi.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: workflow-service
          uri: ${WORKFLOW_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/workflows/**, /api/executions/**, /api/integrations/**
        - id: organization-service
          uri: ${ORGANIZATION_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/organizations/**
