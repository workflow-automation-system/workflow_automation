apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: workflow-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: workflow-automation-backend-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/auth_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: workflow-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workflow-secret
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: workflow-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              value: "86400000"
            - name: APP_BACKEND_URL
              value: http://localhost:30085
            - name: APP_FRONTEND_URL
              value: http://localhost:3000

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: workflow-automation
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP