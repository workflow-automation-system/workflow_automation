name: API Gateway CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'workflow-automation-backend/api-gateway/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'workflow-automation-backend/api-gateway/**'
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow-automation-backend/api-gateway
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven Build
        run: mvn clean install

  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Compose File
        run: docker compose config
