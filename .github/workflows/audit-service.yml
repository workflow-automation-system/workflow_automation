name: Audit Service CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'workflow-automation-backend/audit-service/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'workflow-automation-backend/audit-service/**'
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: audit_db
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
    defaults:
      run:
        working-directory: workflow-automation-backend/audit-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          DB_URL=jdbc:postgresql://localhost:5432/audit_db
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SPRING_RABBITMQ_HOST=localhost
          SPRING_RABBITMQ_PORT=5672
          SPRING_RABBITMQ_USERNAME=guest
          SPRING_RABBITMQ_PASSWORD=guest
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven Build and Test
        run: mvn clean install -Dspring.profiles.active=test
