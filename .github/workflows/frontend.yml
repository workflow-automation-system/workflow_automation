name: Frontend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'workflow-automation-frontend/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'workflow-automation-frontend/**'
  workflow_dispatch:

jobs:
  build:
    name: Frontend Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow-automation-frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL || 'http://localhost:8085' }}
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: workflow-automation-frontend/package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

#      - name: Run Tests
#        run: npm test -- --watchAll=false
#        env:
#          CI: true

      - name: Build Application
        run: npm run build
