version: '3.8'

services:
  # ==========================================
  # Base de données PostgreSQL partagée
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: pfa-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./workflow-automation-backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - pfa-network

  # ==========================================
  # Microservice 1 : Auth Service
  # ==========================================
  auth-service:
    build:
      context: ./workflow-automation-backend/auth-service
      dockerfile: Dockerfile
    container_name: pfa-auth-service
    ports:
      - "8081:8081"
    env_file:
      - ./workflow-automation-backend/auth-service/.env
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/auth_db
      - ORGANIZATION_SERVICE_URL=http://organization-service:8083/api/organizations
    depends_on:
      - postgres
    networks:
      - pfa-network

  # ==========================================
  # Microservice 2 : Workflow Service
  # ==========================================
  workflow-service:
    build:
      context: ./workflow-automation-backend/workflow-service
      dockerfile: Dockerfile
    container_name: pfa-workflow-service
    ports:
      - "8082:8082"
    env_file:
      - ./workflow-automation-backend/workflow-service/.env
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/workflow_db
    depends_on:
      - postgres
    networks:
      - pfa-network

  # ==========================================
  # Microservice 3 : Organization Service
  # ==========================================
  organization-service:
    build:
      context: ./workflow-automation-backend/organization-service
      dockerfile: Dockerfile
    container_name: pfa-organization-service
    ports:
      - "8083:8083"
    env_file:
      - ./workflow-automation-backend/organization-service/.env
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/organization_db
    depends_on:
      - postgres
    networks:
      - pfa-network

  # ==========================================
  # API Gateway
  # ==========================================
  api-gateway:
    build:
      context: ./workflow-automation-backend/api-gateway
      dockerfile: Dockerfile
    container_name: pfa-api-gateway
    ports:
      - "8085:8085"
    env_file:
      - ./workflow-automation-backend/api-gateway/.env
    environment:
      - AUTH_SERVICE_URI=http://auth-service:8081
      - WORKFLOW_SERVICE_URI=http://workflow-service:8082
      - ORGANIZATION_SERVICE_URI=http://organization-service:8083
      - TEMPLATE_SERVICE_URI=http://template-service:8084
    depends_on:
      - auth-service
      - workflow-service
      - organization-service
      - template-service
    networks:
      - pfa-network

  # ==========================================
  # Frontend : React Application (Dev mode avec HMR)
  # ==========================================
  frontend:
    build:
      context: ./workflow-automation-frontend
      dockerfile: Dockerfile
    container_name: pfa-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./workflow-automation-frontend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_POLLING_INTERVAL=300
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=3000
      - WDS_SOCKET_HOST=localhost
      - FAST_REFRESH=true
    volumes:
      - ./workflow-automation-frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    networks:
      - pfa-network

  # ==========================================
  # Microservice 4 : Template Service
  # ==========================================
  template-service:
    build:
      context: ./workflow-automation-backend/template-service
      dockerfile: Dockerfile
    container_name: pfa-template-service
    ports:
      - "8084:8084"
    env_file:
      - ./workflow-automation-backend/template-service/.env
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/template_db
      - WORKFLOW_SERVICE_URL=http://workflow-service:8082
    depends_on:
      - postgres
      - workflow-service
    networks:
      - pfa-network

# ==========================================
# Configuration des Volumes Globaux
# ==========================================
volumes:
  postgres_data:

# ==========================================
# Configuration du Réseau Global
# ==========================================
networks:
  pfa-network:
    driver: bridge